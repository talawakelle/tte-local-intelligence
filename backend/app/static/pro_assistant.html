<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTE Pro Assistant</title><style>:root{--g:#28734f;--d:#102f23;--line:#d8e4dc;--bg:#f3f7f4;--mut:#617168}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial;color:#17231d}header{background:linear-gradient(135deg,var(--d),var(--g));color:#fff;padding:20px 4vw}.head{max-width:1500px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{border:0;border-radius:9px;padding:9px 12px;background:#fff;color:var(--d);font-weight:800}.page{max-width:1500px;margin:20px auto;padding:0 20px 50px;display:grid;grid-template-columns:320px 1fr;gap:16px}@media(max-width:900px){.page{grid-template-columns:1fr}}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #102f2314}.side{padding:17px;align-self:start}.lab{display:block;margin:13px 0 6px;font-size:12px;font-weight:900;text-transform:uppercase;color:var(--mut)}select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.status{margin-top:13px;padding:11px;border-radius:9px;background:#fff0c9;color:#805000;font-weight:700}.examples{display:grid;gap:7px;max-height:350px;overflow:auto}.ex{border:1px solid var(--line);border-radius:9px;background:#f3faf6;padding:9px;text-align:left;color:#1e593f}.chat{min-height:780px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.chathead{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.messages{padding:18px;min-height:480px;max-height:680px;overflow:auto;display:flex;flex-direction:column;gap:14px}.msg{max-width:95%;padding:14px 16px;border-radius:16px;line-height:1.55;white-space:pre-wrap}.user{align-self:flex-end;background:#1e593f;color:#fff}.assistant{align-self:flex-start;border:1px solid var(--line)}.error{background:#ffe2e2;color:#922b2b}.meta,.plan{margin-top:9px;padding:9px;border-radius:8px;font-size:12px}.meta{border-top:1px solid var(--line);color:var(--mut)}.plan{background:#eef4ff;color:#204f86}.warn{margin-top:9px;padding:9px;background:#fff0c9;color:#805000;border-radius:8px}details{margin-top:10px;border:1px solid var(--line);border-radius:9px;overflow:hidden}summary{padding:9px;background:#f3faf6;font-weight:800}.tw{overflow:auto;max-height:340px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #edf2ee;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f3faf6}.chart{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.chart svg{width:100%;height:280px}.composer{padding:14px;border-top:1px solid var(--line)}.compose{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}textarea{min-height:82px}.send{border:0;border-radius:10px;background:var(--g);color:#fff;padding:13px 19px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.act{border:1px solid var(--line);background:#fff;color:#1e593f;padding:7px 9px;border-radius:8px;font-weight:800}</style></head><body><header><div class="head"><div><h1>TTE Production Intelligence Pro</h1><div>Safe query planning, evidence, charts and reports</div></div><div class="nav"><button onclick="location.href='/pro-governance'">Governance</button><button onclick="location.href='/pro-admin'">Users</button><button onclick="window.open('/monitor')">Monitor</button><button onclick="logout()">Logout</button></div></div></header><main class="page"><aside class="card side"><strong id="who">Loading...</strong><span class="lab">Estate</span><select id="estate" onchange="estateChanged()"></select><span class="lab">Month</span><select id="month" onchange="monthChanged()"></select><span class="lab">Division</span><select id="division"></select><div id="status" class="status"></div><span class="lab">Examples</span><div id="examples" class="examples"></div></aside><section class="card chat"><div class="chathead"><strong>Ask a natural-language question</strong><span id="badge"></span></div><div id="messages" class="messages"><div class="msg assistant">The LLM creates a JSON plan only. The server validates it and runs a prewritten read-only query. The LLM never runs SQL.</div></div><div class="composer"><div class="compose"><textarea id="q" placeholder="Which fields have low yield but high fertilizer usage?"></textarea><button id="send" class="send" onclick="ask()">Ask</button></div><div class="actions"><button class="act" onclick="csv()">Download CSV</button><button class="act" onclick="report('xlsx')">Excel</button><button class="act" onclick="report('docx')">Word</button><button class="act" onclick="report('pdf')">PDF</button><button class="act" onclick="report('pptx')">PowerPoint</button></div></div></section></main><script>
let opt,batch,prev=null,hist=[],last=[],lastPayload;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}async function J(u,o={}){let r=await fetch(u,o),t=await r.text(),d;try{d=t?JSON.parse(t):{}}catch{d={detail:t}}if(r.status===401){location.href='/pro-login';throw Error('Login')}if(!r.ok)throw Error(d.detail||r.status);return d}function tbl(a){if(!a?.length)return'<div style="padding:10px">No rows</div>';let c=[...new Set(a.flatMap(x=>Object.keys(x)))];return`<div class=tw><table><thead><tr>${c.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${a.map(x=>`<tr>${c.map(k=>`<td>${esc(x[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function chart(c){if(!c)return'';let L=c.labels||[],S=c.series||[{values:c.values||[]}],V=S.flatMap(x=>x.values||[]).map(Number).filter(Number.isFinite),M=Math.max(...V,1),w=900,h=260,p=45;if(c.type==='scatter'){let xs=c.x_values.map(Number),ys=c.y_values.map(Number),mx=Math.max(...xs,1),my=Math.max(...ys,1);return`<div class=chart><b>${esc(c.title)}</b><svg viewBox="0 0 ${w} ${h}">${xs.map((x,i)=>`<circle cx="${p+x/mx*(w-2*p)}" cy="${h-p-ys[i]/my*(h-2*p)}" r="6" fill="#28734f"><title>${esc(L[i])}</title></circle>`).join('')}</svg></div>`}if(c.type==='line'){let v=S[0].values.map(Number),pts=v.map((x,i)=>`${p+i*(w-2*p)/Math.max(1,v.length-1)},${h-p-x/M*(h-2*p)}`).join(' ');return`<div class=chart><b>${esc(c.title)}</b><svg viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#28734f" stroke-width="4"/></svg></div>`}let bw=(w-2*p)/Math.max(1,L.length),bar=Math.max(6,bw*.7/S.length);return`<div class=chart><b>${esc(c.title)}</b><svg viewBox="0 0 ${w} ${h}">${L.map((l,i)=>S.map((s,j)=>{let v=Number(s.values[i])||0,x=p+i*bw+bw*.15+j*bar,y=h-p-v/M*(h-2*p);return`<rect x="${x}" y="${y}" width="${bar-2}" height="${h-p-y}" fill="${j?'#83a992':'#28734f'}"/>`}).join('')).join('')}</svg></div>`}function add(type,text,p){let d=document.createElement('div');d.className='msg '+type;if(p){last=p.supporting_rows||[];lastPayload=p;d.innerHTML=`<div>${esc(text)}</div>${(p.warnings||[]).map(x=>`<div class=warn>${esc(x)}</div>`).join('')}${(p.limitations||[]).map(x=>`<div class=warn>${esc(x)}</div>`).join('')}${chart(p.chart)}<div class=plan>Validated plan: ${esc(JSON.stringify(p.plan))}<br>LLM SQL: ${p.sql_generated_by_llm}</div><div class=meta>Estate ${esc(p.estate_name)} | Month ${esc(p.reporting_month)} | Division ${esc(p.division_name||'All')} | Role ${esc(p.user_role)} | Sources ${esc((p.source_tables||[]).join(', '))}</div><details><summary>Supporting data (${p.supporting_rows.length})</summary>${tbl(p.supporting_rows)}</details><details><summary>Evidence (${p.evidence.length})</summary>${tbl(p.evidence)}</details>`}else d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}async function load(){opt=await J('/api/pro/options');$('who').textContent=opt.user.display_name+' ('+opt.user.role+')';$('estate').innerHTML=[...new Set(opt.batches.map(x=>x.estate_name))].map(x=>`<option>${esc(x)}</option>`).join('');$('examples').innerHTML=opt.examples.map(x=>`<button class=ex onclick='use(${JSON.stringify(x)})'>${esc(x)}</button>`).join('');estateChanged()}function estateChanged(){let e=$('estate').value,b=opt.batches.filter(x=>x.estate_name===e);$('month').innerHTML=b.map(x=>`<option>${x.reporting_month}</option>`).join('');monthChanged()}function monthChanged(){batch=opt.batches.find(x=>x.estate_name===$('estate').value&&x.reporting_month===$('month').value);$('division').innerHTML='<option value="">All divisions</option>'+batch.divisions.map(x=>`<option>${esc(x)}</option>`).join('');$('status').textContent=batch.data_mode==='APPROVED'?'APPROVED PRODUCTION DATA':'PREVIEW - not final approved';$('badge').textContent=batch.estate_name+' | '+batch.reporting_month+' | '+batch.data_mode}function use(x){$('q').value=x;$('q').focus()}async function ask(){let z=$('q').value.trim();if(!z)return;add('user',z);$('q').value='';$('send').disabled=true;try{let p=await J('/api/pro/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:z,estate_name:batch.estate_name,reporting_month:batch.reporting_month,division_name:$('division').value||null,previous_plan:prev,history:hist.slice(-10)})});prev=p.plan;hist.push({role:'user',content:z},{role:'assistant',content:p.answer});localStorage.setItem('tteProHistory',JSON.stringify(hist.slice(-10)));localStorage.setItem('tteProPlan',JSON.stringify(prev));add('assistant',p.answer,p)}catch(e){add('error',e.message)}finally{$('send').disabled=false}}function csv(){if(!last.length)return alert('No rows');let c=[...new Set(last.flatMap(x=>Object.keys(x)))],s=[c.join(','),...last.map(x=>c.map(k=>`"${String(x[k]??'').replaceAll('"','""')}"`).join(','))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='tte_evidence.csv';a.click()}async function report(f){let kind=prev?.operation==='compare_divisions'?'division_comparison':prev?.operation==='data_quality'?'data_quality':prev?.operation==='cop_drivers'?'cop_analysis':'management_summary',r=await J('/api/pro/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({estate_name:batch.estate_name,reporting_month:batch.reporting_month,division_name:$('division').value||null,kind,format:f})});window.open(r.download_url)}async function logout(){await J('/api/pro/logout',{method:'POST'});location.href='/pro-login'}$('q').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')ask()});try{hist=JSON.parse(localStorage.getItem('tteProHistory')||'[]');prev=JSON.parse(localStorage.getItem('tteProPlan')||'null')}catch{}load().catch(e=>add('error',e.message));</script></body></html>
