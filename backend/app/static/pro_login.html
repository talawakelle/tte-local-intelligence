<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTE Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102f23,#28734f);font-family:Segoe UI,Arial}.card{width:min(420px,92vw);background:#fff;border-radius:18px;padding:28px;box-shadow:0 20px 50px #0004}h1{color:#102f23}label{display:block;margin:14px 0 6px;font-weight:700;color:#617168}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8e4dc;border-radius:10px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#28734f;color:#fff;font-weight:800}.err{color:#922b2b;margin-top:10px}</style></head><body><div class="card"><h1>TTE Production Intelligence</h1><p>Secure login</p><label>Username</label><input id="u"><label>Password</label><input id="p" type="password"><button onclick="go()">Sign In</button><div id="e" class="err"></div></div><script>async function go(){let r=await fetch('/api/pro/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}),d=await r.json();if(!r.ok){e.textContent=d.detail||'Login failed';return}location.href='/pro-assistant'}p.addEventListener('keydown',x=>{if(x.key==='Enter')go()})</script></body></html>
