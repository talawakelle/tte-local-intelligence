<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTE Governance</title><style>body{margin:0;background:#f3f7f4;font-family:Segoe UI,Arial;color:#17231d}header{background:linear-gradient(135deg,#102f23,#28734f);color:#fff;padding:20px 4vw}.head{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.nav{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:9px 12px;font-weight:800}.nav button{background:#fff;color:#102f23}main{max-width:1400px;margin:20px auto;padding:0 20px 50px}.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:15px}.card{background:#fff;border:1px solid #d8e4dc;border-radius:14px;box-shadow:0 9px 25px #102f2314}.k{padding:14px}.val{font-size:26px;font-weight:900;color:#102f23}.issue{margin-bottom:13px;overflow:hidden}.ih{padding:13px 15px;border-bottom:1px solid #d8e4dc;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.ib{padding:15px}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.HIGH,.CRITICAL{background:#ffe2e2;color:#922b2b}.MEDIUM,.LOW{background:#fff0c9;color:#805000}.RESOLVED{background:#e5f3ea;color:#102f23}.msg{padding:11px;background:#fff0c9;color:#805000;border-radius:9px;font-weight:700}.form,.month{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.month{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:750px){.form,.month{grid-template-columns:1fr}}select,input,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d8e4dc;border-radius:8px}textarea{min-height:70px}.full{grid-column:1/-1}.green{background:#28734f;color:#fff}.monthbox{padding:15px;margin-bottom:15px}.lab{font-size:12px;font-weight:900;text-transform:uppercase;color:#617168}</style></head><body><header><div class=head><div><h1>TTE Production Governance</h1><div>Issues, approvals, corrections, replacement and month locking</div></div><div class=nav><button onclick="location.href='/pro-assistant'">Assistant</button><button onclick="location.href='/pro-admin'">Users</button><button onclick="scan()">Run Scan</button><button onclick="refreshFacts()">Refresh Metrics</button></div></div></header><main><section class=sum><div class="card k"><div>Open</div><div id=o class=val>0</div></div><div class="card k"><div>High/Critical</div><div id=h class=val>0</div></div><div class="card k"><div>Resolved</div><div id=r class=val>0</div></div><div class="card k"><div>Total</div><div id=t class=val>0</div></div></section><section id=monthbox class="card monthbox"></section><div id=issues></div></main><script>
let opt,batch;function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}async function J(u,o={}){let r=await fetch(u,o),t=await r.text(),d;try{d=t?JSON.parse(t):{}}catch{d={detail:t}}if(r.status===401){location.href='/pro-login';throw Error('Login')}if(!r.ok)throw Error(d.detail||r.status);return d}async function scan(){let x=await J('/api/pro/governance/scan',{method:'POST'});alert('New issues: '+x.issues_created);loadIssues()}async function refreshFacts(){let x=await J('/api/pro/refresh-metrics',{method:'POST'});alert('Facts: '+x.metric_facts_inserted)}async function act(id){let action=document.getElementById('a'+id).value,note=document.getElementById('n'+id).value,confirm_text=document.getElementById('c'+id).value,official_source=document.getElementById('s'+id).value,manual=document.getElementById('m'+id).value;try{await J('/api/pro/governance/issues/'+id+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,note,confirm_text,official_source:official_source||null,manual_value:official_source==='MANUAL'?Number(manual):null})});alert('Recorded');loadIssues()}catch(e){alert(e.message)}}async function control(){try{let x=await J('/api/pro/governance/month/'+batch.batch_id+'/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:mcA.value,note:mcN.value,confirm_text:mcC.value})});alert(x.status);location.reload()}catch(e){alert(e.message)}}function card(x){let cls=x.status==='RESOLVED'?'RESOLVED':x.severity;return`<section class="card issue"><div class=ih><strong>${esc(x.estate_name)} | ${esc(x.reporting_month)} | ${esc(x.issue_type)} | ${esc(x.metric_name)}</strong><span class="badge ${cls}">${esc(x.status)} - ${esc(x.severity)}</span></div><div class=ib><div class=msg>${esc(x.manager_message)}</div>${x.status==='RESOLVED'?`<div class=msg style="margin-top:10px;background:#e5f3ea;color:#102f23">Resolved by ${esc(x.resolved_by)}. ${esc(x.resolution_note)} ${x.official_value!=null?'Official '+x.official_value+' ('+esc(x.official_source)+')':''}</div>`:`<div class=form><div><div class=lab>Action</div><select id="a${x.issue_id}"><option value=MARK_REVIEWED>Mark reviewed</option><option value=DISMISS_WITH_REASON>Dismiss with reason</option><option value=RETURN_FOR_CORRECTION>Return for correction</option>${x.issue_type==='SOURCE_RECONCILIATION'?'<option value=APPROVE_OFFICIAL_METRIC>Approve official metric</option>':''}</select></div><div><div class=lab>Official source</div><select id="s${x.issue_id}"><option value="">Not applicable</option><option value=G_REPORT>G Report</option><option value=PLUCKING_PLAN>Plucking Plan</option><option value=MANUAL>Manual</option></select></div><div><div class=lab>Manual value</div><input id="m${x.issue_id}" type=number></div><div><div class=lab>Confirmation</div><input id="c${x.issue_id}" placeholder="CONFIRM MANAGEMENT ACTION"></div><div class=full><div class=lab>Note</div><textarea id="n${x.issue_id}"></textarea></div><div><button class=green onclick="act('${x.issue_id}')">Record Action</button></div></div>`}</div></section>`}async function loadIssues(){let x=await J('/api/pro/governance/issues');o.textContent=x.filter(z=>z.status==='OPEN').length;h.textContent=x.filter(z=>z.status==='OPEN'&&['HIGH','CRITICAL'].includes(z.severity)).length;r.textContent=x.filter(z=>z.status==='RESOLVED').length;t.textContent=x.length;issues.innerHTML=x.map(card).join('')}async function init(){opt=await J('/api/pro/options');batch=opt.batches[0];monthbox.innerHTML=`<h3>Month Control - ${esc(batch?.estate_name)} ${esc(batch?.reporting_month)}</h3><div class=month><select id=mcA><option value=APPROVE_MONTH>Approve month</option><option value=REJECT_MONTH>Reject month</option><option value=RETURN_FOR_CORRECTION>Return for correction</option><option value=MARK_REPLACEMENT_REQUIRED>Require replacement</option><option value=LOCK_MONTH>Lock month</option><option value=UNLOCK_MONTH>Unlock month</option><option value=ADD_NOTE>Add note</option></select><input id=mcC placeholder="CONFIRM MONTH CONTROL"><button class=green onclick=control()>Apply</button><textarea id=mcN class=full placeholder="Management note"></textarea></div>`;await loadIssues()}init().catch(e=>alert(e.message));</script></body></html>
