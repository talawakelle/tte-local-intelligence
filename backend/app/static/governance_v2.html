<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTE Governance V2</title>
<style>
:root{--g950:#102f23;--g700:#28734f;--g100:#e5f3ea;--amber:#fff0c9;--amberT:#805000;--red:#ffe2e2;--redT:#922b2b;--line:#d8e4dc;--bg:#f3f7f4;--muted:#617168}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17231d}header{background:linear-gradient(135deg,var(--g950),var(--g700));color:white;padding:22px clamp(16px,4vw,48px)}.head{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0}.nav{display:flex;gap:8px}.nav button,button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.nav button{background:white;color:var(--g950)}main{max-width:1400px;margin:22px auto 60px;padding:0 clamp(12px,3vw,30px)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}.card{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 28px rgba(16,47,35,.08)}.sum{padding:15px}.label{font-size:12px;font-weight:900;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}.value{font-size:26px;font-weight:900;color:var(--g950);margin-top:6px}.issue{margin-bottom:14px;overflow:hidden}.issueHead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.issueBody{padding:16px}.badge{border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.HIGH{background:var(--red);color:var(--redT)}.MEDIUM,.LOW{background:var(--amber);color:var(--amberT)}.RESOLVED{background:var(--g100);color:var(--g950)}.message{padding:12px;border-radius:10px;background:var(--amber);color:var(--amberT);font-weight:700;line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;margin-top:12px}.metric{border:1px solid var(--line);border-radius:9px;padding:10px;background:#f7fbf8}.form{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}@media(max-width:700px){.form{grid-template-columns:1fr}}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}textarea{min-height:76px}.full{grid-column:1/-1}.approve{background:var(--g700);color:white}.scan{background:white;color:var(--g950)}
</style>
</head>
<body>
<header><div class="head"><div><h1>TTE Data Governance V2</h1><div>Management problems, anomaly review and official metric approval</div></div><div class="nav"><button onclick="window.open('/assistant','_blank')">Advanced Assistant</button><button onclick="window.open('/monitor','_blank')">Monitor</button><button class="scan" onclick="scan()">Run Scan</button></div></div></header>
<main>
<section class="summary"><div class="card sum"><div class="label">Open</div><div id="open" class="value">0</div></div><div class="card sum"><div class="label">High</div><div id="high" class="value">0</div></div><div class="card sum"><div class="label">Resolved</div><div id="resolved" class="value">0</div></div><div class="card sum"><div class="label">Total issues</div><div id="total" class="value">0</div></div></section>
<div id="issues"></div>
</main>
<script>
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function num(v,d=2){const n=Number(v);return Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):"-"}
async function getJson(u,o={}){const r=await fetch(u,o),t=await r.text();let d;try{d=t?JSON.parse(t):{}}catch{d={detail:t}}if(!r.ok)throw new Error(d.detail||`Request failed: ${r.status}`);return d}
async function scan(){const r=await getJson("/api/governance-v2/scan",{method:"POST"});alert(`Scan completed. ${r.issues_created} new issue(s).`);load()}
async function resolve(id){const action=document.getElementById(`action-${id}`).value,approved_by=document.getElementById(`by-${id}`).value.trim(),note=document.getElementById(`note-${id}`).value.trim(),confirm_text=document.getElementById(`confirm-${id}`).value.trim(),official_source=document.getElementById(`source-${id}`).value,manual=document.getElementById(`manual-${id}`).value;try{await getJson(`/api/governance-v2/issues/${encodeURIComponent(id)}/resolve`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,approved_by,note,confirm_text,official_source:official_source||null,manual_value:official_source==="MANUAL"?Number(manual):null})});alert("Management action recorded.");load()}catch(e){alert(e.message)}}
function html(i){const resolved=i.status==="RESOLVED",cls=resolved?"RESOLVED":i.severity;return`<section class="card issue"><div class="issueHead"><strong>${esc(i.estate_name)} | ${esc(i.reporting_month)} | ${esc(i.issue_type)} | ${esc(i.metric_name)}</strong><span class="badge ${cls}">${esc(i.status)} - ${esc(i.severity)}</span></div><div class="issueBody"><div class="message">${esc(i.manager_message)}</div><div class="metrics"><div class="metric"><div class="label">${esc(i.source_a_name||"Source A")}</div><strong>${num(i.source_a_value)}</strong></div><div class="metric"><div class="label">${esc(i.source_b_name||"Source B")}</div><strong>${num(i.source_b_value)}</strong></div><div class="metric"><div class="label">Difference/count</div><strong>${num(i.difference_value)}</strong></div><div class="metric"><div class="label">Difference %</div><strong>${num(i.difference_pct)}%</strong></div></div>${resolved?`<div class="message" style="margin-top:12px;background:#e5f3ea;color:#102f23">Resolved by ${esc(i.resolved_by)}. ${esc(i.resolution_note)} ${i.official_value!=null?`Official value: ${num(i.official_value)} (${esc(i.official_source)})`:""}</div>`:`<div class="form"><div><div class="label">Action</div><select id="action-${i.issue_id}"><option value="MARK_REVIEWED">Mark reviewed</option><option value="DISMISS_WITH_REASON">Dismiss with reason</option>${i.issue_type==="SOURCE_RECONCILIATION"?'<option value="APPROVE_OFFICIAL_METRIC">Approve official metric</option>':""}</select></div><div><div class="label">Official source when approving</div><select id="source-${i.issue_id}"><option value="">Not applicable</option><option value="G_REPORT">G Report</option><option value="PLUCKING_PLAN">Plucking Plan</option><option value="MANUAL">Manual value</option></select></div><div><div class="label">Manual value</div><input id="manual-${i.issue_id}" type="number" step="0.01"></div><div><div class="label">Manager</div><input id="by-${i.issue_id}" placeholder="Manager name"></div><div class="full"><div class="label">Management note</div><textarea id="note-${i.issue_id}"></textarea></div><div><div class="label">Confirmation text</div><input id="confirm-${i.issue_id}" placeholder="CONFIRM MANAGEMENT ACTION"></div><div><button class="approve" onclick="resolve('${i.issue_id}')">Record Action</button></div></div>`}</div></section>`}
async function load(){const issues=await getJson("/api/governance-v2/issues");document.getElementById("open").textContent=issues.filter(i=>i.status==="OPEN").length;document.getElementById("high").textContent=issues.filter(i=>i.status==="OPEN"&&i.severity==="HIGH").length;document.getElementById("resolved").textContent=issues.filter(i=>i.status==="RESOLVED").length;document.getElementById("total").textContent=issues.length;document.getElementById("issues").innerHTML=issues.length?issues.map(html).join(""):'<div class="card" style="padding:30px;text-align:center">No issues. Run the scan.</div>'}
scan().catch(e=>alert(e.message));
</script>
</body>
</html>
