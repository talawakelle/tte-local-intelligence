<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTE Users</title><style>body{margin:0;background:#f3f7f4;font-family:Segoe UI,Arial}header{background:#102f23;color:#fff;padding:20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between}button{border:0;border-radius:9px;padding:9px 12px;font-weight:800}.page{max-width:1100px;margin:20px auto;padding:0 15px}.card{background:#fff;border:1px solid #d8e4dc;border-radius:14px;padding:16px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}@media(max-width:650px){.grid{grid-template-columns:1fr}}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d8e4dc;border-radius:8px}.full{grid-column:1/-1}.green{background:#28734f;color:#fff}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #d8e4dc;text-align:left}</style></head><body><header><div class=head><h1>User Administration</h1><button onclick="location.href='/pro-assistant'">Assistant</button></div></header><main class=page><section class=card><h2>Create User</h2><div class=grid><input id=u placeholder=Username><input id=d placeholder="Display name"><input id=p type=password placeholder=Password><select id=role><option>management</option><option>regional</option><option>estate</option><option>agriculture</option><option>finance</option><option>sustainability</option><option>viewer</option></select><input id=s class=full placeholder="Estate scope, comma separated"><button class=green onclick=create()>Create</button></div></section><section class=card><h2>Users</h2><div id=list></div></section></main><script>async function J(u,o={}){let r=await fetch(u,o),t=await r.text(),d;try{d=t?JSON.parse(t):{}}catch{d={detail:t}}if(r.status===401)location.href='/pro-login';if(!r.ok)throw Error(d.detail||r.status);return d}async function load(){let x=await J('/api/pro/admin/users');list.innerHTML='<table><tr><th>User</th><th>Name</th><th>Role</th><th>Scope</th></tr>'+x.map(z=>`<tr><td>${z.username}</td><td>${z.display_name}</td><td>${z.role}</td><td>${z.estate_scope_json}</td></tr>`).join('')+'</table>'}async function create(){try{await J('/api/pro/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,display_name:d.value,password:p.value,role:role.value,estate_scope:s.value.split(',').map(x=>x.trim()).filter(Boolean)})});alert('Created');load()}catch(e){alert(e.message)}}load().catch(e=>alert(e.message));</script></body></html>
